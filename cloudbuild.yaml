# Cloud Build: deploy Nest app + Meu Pluggy Playwright Job on push to master.
# Trigger: scripts/setup-cloudbuild-trigger.ps1 (one-time)
#
# Substitutions (set on the trigger or defaults below):
#   _REGION, _SERVICE, _JOB, _AR_REPO
#   _MEU_PLUGGY_STORAGE_STATE_GCS  (required for Job step)
#   _MEU_PLUGGY_PROGRESS_GCS       (optional; derived from storage state)
#   _RUN_PRISMA_MIGRATE            (true|false, default true)
#
# Secrets (Secret Manager -> Cloud Build):
#   DATABASE_URL - used when _RUN_PRISMA_MIGRATE=true
#
# Bash vars inside steps must use $$ so Cloud Build does not treat them as substitutions.

substitutions:
  _REGION: southamerica-east1
  _SERVICE: organizze-pluggy
  _JOB: meu-pluggy-refresh
  _AR_REPO: cloud-run-source-deploy
  _MEU_PLUGGY_STORAGE_STATE_GCS: ''
  _MEU_PLUGGY_PROGRESS_GCS: ''
  _RUN_PRISMA_MIGRATE: 'true'

options:
  logging: CLOUD_LOGGING_ONLY

steps:
  - id: prisma-migrate
    name: node:22
    entrypoint: bash
    secretEnv: ['DATABASE_URL']
    args:
      - -c
      - |
        set -euo pipefail
        if [[ "${_RUN_PRISMA_MIGRATE}" != "true" ]]; then
          echo "Skip prisma migrate (_RUN_PRISMA_MIGRATE=${_RUN_PRISMA_MIGRATE})"
          exit 0
        fi
        cd api
        npm ci
        npx prisma migrate deploy

  - id: ensure-artifact-registry
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        gcloud artifacts repositories describe "${_AR_REPO}" \
          --location="${_REGION}" \
          --quiet >/dev/null 2>&1 || \
        gcloud artifacts repositories create "${_AR_REPO}" \
          --location="${_REGION}" \
          --repository-format=docker \
          --quiet

  - id: build-app
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:$COMMIT_SHA
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:latest
      - -f
      - Dockerfile
      - .

  - id: push-app
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}

  - id: deploy-app
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        APP_IMAGE="${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:$COMMIT_SHA"
        # Image-only deploy keeps existing Cloud Run env/secrets.
        gcloud run deploy "${_SERVICE}" \
          --image="$$APP_IMAGE" \
          --region="${_REGION}" \
          --platform=managed \
          --quiet

        # Ensure Job trigger env is present (idempotent update).
        UPDATE_VARS="GCP_PROJECT_ID=$PROJECT_ID,GCP_REGION=${_REGION},MEU_PLUGGY_REFRESH_JOB=${_JOB}"
        if [[ -n "${_MEU_PLUGGY_STORAGE_STATE_GCS}" ]]; then
          UPDATE_VARS="$${UPDATE_VARS},MEU_PLUGGY_STORAGE_STATE_GCS=${_MEU_PLUGGY_STORAGE_STATE_GCS}"
          PROGRESS_GCS="${_MEU_PLUGGY_PROGRESS_GCS}"
          if [[ -z "$$PROGRESS_GCS" ]]; then
            PROGRESS_GCS="${_MEU_PLUGGY_STORAGE_STATE_GCS}"
            PROGRESS_GCS="$${PROGRESS_GCS%/storageState.json}/progress.json"
          fi
          UPDATE_VARS="$${UPDATE_VARS},MEU_PLUGGY_PROGRESS_GCS=$$PROGRESS_GCS"
        fi
        gcloud run services update "${_SERVICE}" \
          --region="${_REGION}" \
          --update-env-vars="$$UPDATE_VARS" \
          --quiet

  - id: build-job
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_JOB}:$COMMIT_SHA
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_JOB}:latest
      - -f
      - Dockerfile.meu-pluggy-refresh
      - .

  - id: push-job
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_JOB}

  - id: deploy-job
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        if [[ -z "${_MEU_PLUGGY_STORAGE_STATE_GCS}" ]]; then
          echo "Skip Job deploy (_MEU_PLUGGY_STORAGE_STATE_GCS empty)."
          exit 0
        fi
        JOB_IMAGE="${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_JOB}:$COMMIT_SHA"
        PROGRESS_GCS="${_MEU_PLUGGY_PROGRESS_GCS}"
        if [[ -z "$$PROGRESS_GCS" ]]; then
          PROGRESS_GCS="${_MEU_PLUGGY_STORAGE_STATE_GCS}"
          PROGRESS_GCS="$${PROGRESS_GCS%/storageState.json}/progress.json"
        fi
        gcloud run jobs deploy "${_JOB}" \
          --image="$$JOB_IMAGE" \
          --region="${_REGION}" \
          --tasks=1 \
          --max-retries=0 \
          --task-timeout=30m \
          --memory=2Gi \
          --cpu=1 \
          --set-env-vars="MEU_PLUGGY_STORAGE_STATE_GCS=${_MEU_PLUGGY_STORAGE_STATE_GCS},MEU_PLUGGY_PROGRESS_GCS=$$PROGRESS_GCS" \
          --quiet

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:$COMMIT_SHA
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:latest
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_JOB}:$COMMIT_SHA
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_JOB}:latest

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/DATABASE_URL/versions/latest
      env: DATABASE_URL
