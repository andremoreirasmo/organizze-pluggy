# Cloud Build: deploy Nest app + Meu Pluggy Playwright Job on push to master.
# Trigger: scripts/setup-cloudbuild-trigger.ps1 (one-time)
#
# Substitutions (set on the trigger or defaults below):
#   _REGION, _SERVICE, _JOB, _AR_REPO
#   _MEU_PLUGGY_STORAGE_STATE_GCS  (required for Job step)
#   _MEU_PLUGGY_PROGRESS_GCS       (optional; derived from storage state)
#   _RUN_PRISMA_MIGRATE            (true|false, default true)
#   _FORCE_JOB_REBUILD             (true|false) force Playwright Job rebuild
#
# The Job image is rebuilt only when Dockerfile.meu-pluggy-refresh or
# scripts/meu-pluggy-refresh.mjs change (content hash vs GCS marker), unless
# _FORCE_JOB_REBUILD=true.
#
# Secrets (Secret Manager -> Cloud Build):
#   DATABASE_URL - used when _RUN_PRISMA_MIGRATE=true
#
# Bash vars inside steps must use $$ so Cloud Build does not treat them as substitutions.

substitutions:
  _REGION: southamerica-east1
  _SERVICE: organizze-pluggy
  _JOB: meu-pluggy-refresh
  _AR_REPO: cloud-run-source-deploy
  _MEU_PLUGGY_STORAGE_STATE_GCS: ''
  _MEU_PLUGGY_PROGRESS_GCS: ''
  _RUN_PRISMA_MIGRATE: 'true'
  _FORCE_JOB_REBUILD: 'false'

options:
  logging: CLOUD_LOGGING_ONLY

steps:
  - id: prisma-migrate
    name: node:22
    entrypoint: bash
    secretEnv: ['DATABASE_URL']
    args:
      - -c
      - |
        set -euo pipefail
        if [[ "${_RUN_PRISMA_MIGRATE}" != "true" ]]; then
          echo "Skip prisma migrate (_RUN_PRISMA_MIGRATE=${_RUN_PRISMA_MIGRATE})"
          exit 0
        fi
        # Strip BOM / CR that PowerShell secret uploads sometimes add.
        export DATABASE_URL="$(printf '%s' "$$DATABASE_URL" | tr -d '\r' | sed $'s/^\xEF\xBB\xBF//')"
        if [[ ! "$$DATABASE_URL" =~ ^postgres(ql)?:// ]]; then
          echo "DATABASE_URL secret invalid (expected postgres:// URL)"
          exit 1
        fi
        cd api
        npm ci
        npx prisma migrate deploy

  - id: ensure-artifact-registry
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        gcloud artifacts repositories describe "${_AR_REPO}" \
          --location="${_REGION}" \
          --quiet >/dev/null 2>&1 || \
        gcloud artifacts repositories create "${_AR_REPO}" \
          --location="${_REGION}" \
          --repository-format=docker \
          --quiet

  - id: detect-job-changes
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    env:
      - 'PROJECT_ID=$PROJECT_ID'
      - 'CB_REGION=${_REGION}'
      - 'CB_AR_REPO=${_AR_REPO}'
      - 'CB_JOB=${_JOB}'
      - 'CB_STORAGE_STATE_GCS=${_MEU_PLUGGY_STORAGE_STATE_GCS}'
      - 'CB_FORCE_JOB_REBUILD=${_FORCE_JOB_REBUILD}'
    args:
      - -c
      - |
        set -euo pipefail
        JOB_IMAGE_LATEST="$${CB_REGION}-docker.pkg.dev/$${PROJECT_ID}/$${CB_AR_REPO}/$${CB_JOB}:latest"
        HASH="$$(cat Dockerfile.meu-pluggy-refresh scripts/meu-pluggy-refresh.mjs | sha256sum | awk '{print $$1}')"
        echo "$$HASH" > /workspace/job-source.sha256
        echo "Job source hash: $$HASH"

        if [[ -z "$${CB_STORAGE_STATE_GCS}" ]]; then
          echo "No MEU_PLUGGY_STORAGE_STATE_GCS - skip Job pipeline."
          echo "false" > /workspace/rebuild-job
          exit 0
        fi

        MARKER="$${CB_STORAGE_STATE_GCS%/*}/job-source.sha256"
        PREV=""
        if gcloud storage cat "$$MARKER" > /workspace/job-source.prev 2>/dev/null; then
          PREV="$$(tr -d '[:space:]' < /workspace/job-source.prev)"
          echo "Previous Job source hash: $$PREV"
        else
          echo "No previous Job source hash at $$MARKER"
        fi

        IMAGE_EXISTS=false
        if gcloud artifacts docker images describe "$$JOB_IMAGE_LATEST" --quiet >/dev/null 2>&1; then
          IMAGE_EXISTS=true
        fi

        if [[ "$${CB_FORCE_JOB_REBUILD}" == "true" ]]; then
          echo "Force Job rebuild (_FORCE_JOB_REBUILD=true)"
          echo "true" > /workspace/rebuild-job
        elif [[ "$$HASH" == "$$PREV" && "$$IMAGE_EXISTS" == "true" ]]; then
          echo "Job sources unchanged and :latest exists - skip Job rebuild."
          echo "false" > /workspace/rebuild-job
        else
          echo "Job sources changed or image missing - will rebuild Job."
          echo "true" > /workspace/rebuild-job
        fi

  - id: build-app
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:$COMMIT_SHA
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:latest
      - -f
      - Dockerfile
      - .

  - id: push-app
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}

  - id: deploy-app
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    env:
      - 'PROJECT_ID=$PROJECT_ID'
      - 'CB_REGION=${_REGION}'
      - 'CB_AR_REPO=${_AR_REPO}'
      - 'CB_SERVICE=${_SERVICE}'
      - 'CB_JOB=${_JOB}'
      - 'CB_STORAGE_STATE_GCS=${_MEU_PLUGGY_STORAGE_STATE_GCS}'
      - 'CB_PROGRESS_GCS=${_MEU_PLUGGY_PROGRESS_GCS}'
      - 'CB_COMMIT_SHA=$COMMIT_SHA'
    args:
      - -c
      - |
        set -euo pipefail
        APP_IMAGE="$${CB_REGION}-docker.pkg.dev/$${PROJECT_ID}/$${CB_AR_REPO}/$${CB_SERVICE}:$${CB_COMMIT_SHA}"
        # Image-only deploy keeps existing Cloud Run env/secrets.
        gcloud run deploy "$${CB_SERVICE}" \
          --image="$$APP_IMAGE" \
          --region="$${CB_REGION}" \
          --platform=managed \
          --quiet

        # Ensure Job trigger env is present (idempotent update).
        UPDATE_VARS="GCP_PROJECT_ID=$${PROJECT_ID},GCP_REGION=$${CB_REGION},MEU_PLUGGY_REFRESH_JOB=$${CB_JOB}"
        if [[ -n "$${CB_STORAGE_STATE_GCS}" ]]; then
          UPDATE_VARS="$${UPDATE_VARS},MEU_PLUGGY_STORAGE_STATE_GCS=$${CB_STORAGE_STATE_GCS}"
          PROGRESS_GCS="$${CB_PROGRESS_GCS}"
          if [[ -z "$$PROGRESS_GCS" ]]; then
            PROGRESS_GCS="$${CB_STORAGE_STATE_GCS%/storageState.json}/progress.json"
          fi
          UPDATE_VARS="$${UPDATE_VARS},MEU_PLUGGY_PROGRESS_GCS=$$PROGRESS_GCS"
        fi
        gcloud run services update "$${CB_SERVICE}" \
          --region="$${CB_REGION}" \
          --update-env-vars="$$UPDATE_VARS" \
          --quiet

  - id: build-job
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    env:
      - 'PROJECT_ID=$PROJECT_ID'
      - 'CB_REGION=${_REGION}'
      - 'CB_AR_REPO=${_AR_REPO}'
      - 'CB_JOB=${_JOB}'
      - 'CB_COMMIT_SHA=$COMMIT_SHA'
    args:
      - -c
      - |
        set -euo pipefail
        if [[ "$$(cat /workspace/rebuild-job)" != "true" ]]; then
          echo "Skip build-job"
          exit 0
        fi
        docker build \
          -t "$${CB_REGION}-docker.pkg.dev/$${PROJECT_ID}/$${CB_AR_REPO}/$${CB_JOB}:$${CB_COMMIT_SHA}" \
          -t "$${CB_REGION}-docker.pkg.dev/$${PROJECT_ID}/$${CB_AR_REPO}/$${CB_JOB}:latest" \
          -f Dockerfile.meu-pluggy-refresh \
          .

  - id: push-job
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    env:
      - 'PROJECT_ID=$PROJECT_ID'
      - 'CB_REGION=${_REGION}'
      - 'CB_AR_REPO=${_AR_REPO}'
      - 'CB_JOB=${_JOB}'
    args:
      - -c
      - |
        set -euo pipefail
        if [[ "$$(cat /workspace/rebuild-job)" != "true" ]]; then
          echo "Skip push-job"
          exit 0
        fi
        docker push --all-tags \
          "$${CB_REGION}-docker.pkg.dev/$${PROJECT_ID}/$${CB_AR_REPO}/$${CB_JOB}"

  - id: deploy-job
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    env:
      - 'PROJECT_ID=$PROJECT_ID'
      - 'CB_REGION=${_REGION}'
      - 'CB_AR_REPO=${_AR_REPO}'
      - 'CB_JOB=${_JOB}'
      - 'CB_STORAGE_STATE_GCS=${_MEU_PLUGGY_STORAGE_STATE_GCS}'
      - 'CB_PROGRESS_GCS=${_MEU_PLUGGY_PROGRESS_GCS}'
      - 'CB_COMMIT_SHA=$COMMIT_SHA'
    args:
      - -c
      - |
        set -euo pipefail
        if [[ "$$(cat /workspace/rebuild-job)" != "true" ]]; then
          echo "Skip deploy-job (sources unchanged)."
          exit 0
        fi
        if [[ -z "$${CB_STORAGE_STATE_GCS}" ]]; then
          echo "Skip Job deploy (MEU_PLUGGY_STORAGE_STATE_GCS empty)."
          exit 0
        fi
        JOB_IMAGE="$${CB_REGION}-docker.pkg.dev/$${PROJECT_ID}/$${CB_AR_REPO}/$${CB_JOB}:$${CB_COMMIT_SHA}"
        PROGRESS_GCS="$${CB_PROGRESS_GCS}"
        if [[ -z "$$PROGRESS_GCS" ]]; then
          PROGRESS_GCS="$${CB_STORAGE_STATE_GCS%/storageState.json}/progress.json"
        fi
        gcloud run jobs deploy "$${CB_JOB}" \
          --image="$$JOB_IMAGE" \
          --region="$${CB_REGION}" \
          --tasks=1 \
          --max-retries=0 \
          --task-timeout=30m \
          --memory=2Gi \
          --cpu=1 \
          --set-env-vars="MEU_PLUGGY_STORAGE_STATE_GCS=$${CB_STORAGE_STATE_GCS},MEU_PLUGGY_PROGRESS_GCS=$$PROGRESS_GCS" \
          --quiet

        MARKER="$${CB_STORAGE_STATE_GCS%/*}/job-source.sha256"
        gcloud storage cp /workspace/job-source.sha256 "$$MARKER" --quiet
        echo "Saved Job source hash to $$MARKER"

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:$COMMIT_SHA
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:latest

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/DATABASE_URL/versions/latest
      env: DATABASE_URL
