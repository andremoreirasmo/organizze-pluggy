name: Deploy Cloud Run

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-cloudrun-${{ github.ref }}
  cancel-in-progress: true

env:
  GCP_REGION: ${{ vars.GCP_REGION || 'southamerica-east1' }}
  GCP_SERVICE_NAME: ${{ vars.GCP_SERVICE_NAME || 'organizze-pluggy' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate GCP project
        run: |
          if [ -z "${{ vars.GCP_PROJECT_ID }}" ]; then
            echo "Configure repository variable GCP_PROJECT_ID (Settings → Secrets and variables → Actions → Variables)."
            exit 1
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Set up Node (migrations)
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Prisma migrate deploy
        working-directory: api
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          npm ci
          npx prisma migrate deploy

      - name: Write Cloud Run env file
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_ALLOWED_EMAILS: ${{ secrets.GOOGLE_ALLOWED_EMAILS }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          ORGANIZZE_EMAIL: ${{ secrets.ORGANIZZE_EMAIL }}
          ORGANIZZE_API_TOKEN: ${{ secrets.ORGANIZZE_API_TOKEN }}
          ORGANIZZE_USER_AGENT: ${{ secrets.ORGANIZZE_USER_AGENT }}
          PLUGGY_CLIENT_ID: ${{ secrets.PLUGGY_CLIENT_ID }}
          PLUGGY_CLIENT_SECRET: ${{ secrets.PLUGGY_CLIENT_SECRET }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const required = [
            'GOOGLE_CLIENT_ID',
            'GOOGLE_ALLOWED_EMAILS',
            'SESSION_SECRET',
            'ORGANIZZE_EMAIL',
            'ORGANIZZE_API_TOKEN',
            'ORGANIZZE_USER_AGENT',
            'PLUGGY_CLIENT_ID',
            'PLUGGY_CLIENT_SECRET',
            'DATABASE_URL',
          ];
          const lines = ['NODE_ENV: "production"'];
          for (const key of required) {
            const value = process.env[key];
            if (!value || !String(value).trim()) {
              console.error(`Missing GitHub secret: ${key}`);
              process.exit(1);
            }
            if (key === 'SESSION_SECRET' && value.length < 32) {
              console.error('SESSION_SECRET must be at least 32 characters');
              process.exit(1);
            }
            lines.push(`${key}: ${JSON.stringify(value)}`);
          }
          fs.writeFileSync('/tmp/cloudrun-env.yaml', lines.join('\n'));
          NODE

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "${{ env.GCP_SERVICE_NAME }}" \
            --project="${{ vars.GCP_PROJECT_ID }}" \
            --region="${{ env.GCP_REGION }}" \
            --source=. \
            --allow-unauthenticated \
            --port=8080 \
            --memory=512Mi \
            --cpu=1 \
            --min-instances=0 \
            --max-instances=1 \
            --cpu-boost \
            --env-vars-file=/tmp/cloudrun-env.yaml \
            --quiet

      - name: Print service URL
        run: |
          URL="$(gcloud run services describe "${{ env.GCP_SERVICE_NAME }}" \
            --project="${{ vars.GCP_PROJECT_ID }}" \
            --region="${{ env.GCP_REGION }}" \
            --format='value(status.url)')"
          echo "Deployed: ${URL}"
          echo "Health: ${URL}/api/health"

      - name: Remove env file
        if: always()
        run: rm -f /tmp/cloudrun-env.yaml
